spring:
  application:
    name: marketplace-api
  profiles:
    default: dev
  config:
    import:
      - optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:marketplace}
    username: ${POSTGRES_USER:marketplace}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
marketplace:
  checkout:
    reservation-minutes: 15
  scheduler:
    interval-minutes: 5
  jwt:
    expiration-minutes: ${MARKETPLACE_JWT_EXPIRATION_MINUTES:20}
    secret: ${MARKETPLACE_JWT_SECRET:}